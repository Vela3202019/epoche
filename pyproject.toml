[project]
name = "epoche"
version = "0.1.0"
description = "A boundary-fidelity benchmark for AI memory extraction: measures WHERE memory systems fabricate, not just how much they recall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vela Gao" }]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mem0 = ["mem0ai"]
zep = ["zep-cloud"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epoche"]
